<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짤·카드 스튜디오 2 — 캔버스 에디터</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700;900&family=Song+Myung&display=swap" rel="stylesheet">
<style>
:root { --ac:#6d4aff; --ac2:#efeaff; --bd:#e4e6eb; --tx:#1f2330; --mu:#7b8190; }
html,body { height:100%; }
body { font-family:'Noto Sans KR',sans-serif; color:var(--tx); background:#fff; }
button { font-family:inherit; }
.ibtn { display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:34px; padding:0 8px; border-radius:8px; color:#3a3f4d; font-size:13px; cursor:pointer; border:1px solid transparent; background:transparent; white-space:nowrap; }
.ibtn:hover { background:#f1f2f5; }
.ibtn.on { background:var(--ac2); color:var(--ac); border-color:#d9d0ff; }
.ibtn:disabled { opacity:.35; cursor:default; background:transparent; }
.sep { width:1px; height:22px; background:var(--bd); margin:0 6px; flex:none; }
.rail-btn { width:100%; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:#5b6070; cursor:pointer; background:transparent; border:0; }
.rail-btn i { font-size:18px; }
.rail-btn:hover { background:#f4f5f8; }
.rail-btn.on { color:var(--ac); background:var(--ac2); }
.primary { background:var(--ac); color:#fff; border-radius:9px; padding:0 16px; height:36px; font-weight:700; font-size:13px; cursor:pointer; border:0; }
.primary:hover { background:#5a37e8; }
.soft { background:#f3f4f7; border:1px solid var(--bd); border-radius:9px; padding:0 12px; height:34px; font-size:12px; cursor:pointer; color:#333; display:inline-flex; align-items:center; gap:6px; }
.soft:hover { background:#e9ebf0; }
.fld { border:1px solid var(--bd); border-radius:8px; height:34px; padding:0 8px; font-size:12px; background:#fff; color:var(--tx); }
.fld:focus { outline:2px solid #cfc3ff; border-color:var(--ac); }
.sec-t { font-size:12px; font-weight:700; color:#4a4f5e; margin:18px 0 8px; }
.tile { border:1px solid var(--bd); border-radius:10px; background:#fff; cursor:pointer; overflow:hidden; position:relative; }
.tile:hover { border-color:var(--ac); box-shadow:0 2px 10px rgba(109,74,255,.18); }
.swatch { width:100%; aspect-ratio:1; border-radius:8px; border:1px solid rgba(0,0,0,.1); cursor:pointer; }
.swatch:hover { transform:scale(1.08); }
input[type=color] { width:30px; height:30px; padding:0; border:1px solid var(--bd); border-radius:8px; background:#fff; cursor:pointer; }
input[type=range] { accent-color:var(--ac); }
#stage { position:relative; margin:auto; box-shadow:0 4px 24px rgba(20,24,40,.18); background:#fff; touch-action:none; flex:none; }
#sel { position:absolute; border:1.5px solid var(--ac); pointer-events:none; display:none; }
.hd { position:absolute; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; background:#fff; border:1.5px solid var(--ac); border-radius:3px; pointer-events:auto; }
.hd[data-h=n],.hd[data-h=s] { cursor:ns-resize; } .hd[data-h=e],.hd[data-h=w] { cursor:ew-resize; }
.hd[data-h=nw],.hd[data-h=se] { cursor:nwse-resize; } .hd[data-h=ne],.hd[data-h=sw] { cursor:nesw-resize; }
#rot { position:absolute; left:50%; bottom:-38px; width:24px; height:24px; margin-left:-12px; border-radius:50%; background:#fff; border:1.5px solid var(--ac); color:var(--ac); font-size:11px; display:flex; align-items:center; justify-content:center; pointer-events:auto; cursor:grab; box-shadow:0 1px 4px rgba(0,0,0,.15); }
.gl { position:absolute; background:#ff3d8b; pointer-events:none; }
#edit { position:absolute; display:none; margin:0; padding:0; border:0; outline:1.5px dashed var(--ac); background:transparent; resize:none; overflow:hidden; white-space:pre-wrap; word-break:break-all; }
.thumb-del { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; font-size:10px; display:none; align-items:center; justify-content:center; border:0; cursor:pointer; }
.tile:hover .thumb-del { display:flex; }
#toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast { background:#1f2330; color:#fff; font-size:12px; padding:10px 16px; border-radius:10px; display:flex; gap:12px; align-items:center; box-shadow:0 6px 20px rgba(0,0,0,.25); }
.toast.err { background:#b42343; }
.toast button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:6px; padding:3px 9px; cursor:pointer; font-size:12px; }
.row { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:8px; border:1px solid var(--bd); font-size:12px; cursor:pointer; background:#fff; }
.row.on { border-color:var(--ac); background:var(--ac2); }
.pill-pass{background:#e7f8ee;border:1px solid #9fdcb8;color:#157a45;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:700}
.pill-fail{background:#fdeaee;border:1px solid #f0a3b3;color:#b42343;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:700}
.bx{border:1px solid var(--bd);border-radius:10px;padding:9px 10px;background:#fff;font-size:12px}
.checker { background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%); background-size:12px 12px; background-position:0 0,6px 6px; }
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- ===== 상단바 ===== -->
<header class="h-14 flex-none border-b flex items-center gap-2 px-3" style="border-color:var(--bd)">
    <div class="flex items-center gap-2 mr-2">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white" style="background:linear-gradient(135deg,#6d4aff,#a77bff)"><i class="fa-solid fa-wand-magic-sparkles text-sm"></i></div>
        <span class="font-black text-[15px] hidden md:inline">짤·카드 스튜디오</span>
    </div>
    <input id="doc-name" class="fld w-44" maxlength="40" value="제목 없는 디자인">
    <span class="sep"></span>
    <button class="ibtn" data-a="undo" id="b-undo" title="실행취소 (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
    <button class="ibtn" data-a="redo" id="b-redo" title="다시실행 (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>
    <span class="sep"></span>
    <select id="size-sel" class="fld" title="페이지 크기">
        <option value="1080x1080">1:1 인스타 피드 (1080×1080)</option>
        <option value="1080x1350">4:5 카드뉴스 (1080×1350)</option>
        <option value="1080x1920">9:16 스토리 (1080×1920)</option>
        <option value="1920x1080">16:9 썸네일 (1920×1080)</option>
    </select>
    <span id="save-state" class="text-[11px] ml-1" style="color:var(--mu)"></span>
    <div class="flex-1"></div>
    <button class="soft" data-a="tplSave"><i class="fa-regular fa-bookmark"></i>템플릿으로 저장</button>
    <div class="relative">
        <button class="primary" data-a="exportToggle"><i class="fa-solid fa-download mr-1.5"></i>다운로드</button>
        <div id="export-pop" class="hidden absolute right-0 top-11 w-72 bg-white border rounded-xl shadow-xl p-4 z-50" style="border-color:var(--bd)">
            <div class="text-xs font-bold mb-2">파일 형식</div>
            <div class="flex gap-2 mb-3">
                <button class="soft flex-1 justify-center on" data-a="fmt" data-v="png" id="fmt-png" style="border-color:var(--ac);background:var(--ac2)">PNG</button>
                <button class="soft flex-1 justify-center" data-a="fmt" data-v="jpeg" id="fmt-jpeg">JPG</button>
            </div>
            <div class="text-xs font-bold mb-1">크기 <span id="exp-px" class="font-normal" style="color:var(--mu)"></span></div>
            <select id="exp-scale" class="fld w-full mb-3"><option value="0.5">0.5배 (작게)</option><option value="1" selected>1배 (원본)</option><option value="2">2배 (고해상도)</option></select>
            <div id="q-wrap" class="hidden mb-3"><div class="text-xs font-bold mb-1">JPG 품질 <span id="exp-q-v" class="font-normal">92</span></div><input type="range" id="exp-q" min="50" max="100" value="92" class="w-full"></div>
            <button class="primary w-full" data-a="download">내려받기</button>
            <button class="soft w-full justify-center mt-2" data-a="copy"><i class="fa-regular fa-copy"></i>클립보드에 복사</button>
            <p class="text-[11px] mt-2" style="color:var(--mu)">저장 파일에는 위치·카메라 등 메타데이터가 들어가지 않습니다.</p>
        </div>
    </div>
</header>

<div class="flex flex-1 min-h-0">
    <!-- ===== 좌측 레일 ===== -->
    <nav class="w-[76px] flex-none border-r overflow-y-auto" style="border-color:var(--bd)" id="rail">
        <button class="rail-btn" data-a="panel" data-v="templates"><i class="fa-solid fa-table-cells-large"></i>템플릿</button>
        <button class="rail-btn" data-a="panel" data-v="text"><i class="fa-solid fa-font"></i>텍스트</button>
        <button class="rail-btn" data-a="panel" data-v="elements"><i class="fa-solid fa-shapes"></i>요소</button>
        <button class="rail-btn" data-a="panel" data-v="photos"><i class="fa-regular fa-image"></i>사진</button>
        <button class="rail-btn" data-a="panel" data-v="bg"><i class="fa-solid fa-fill-drip"></i>배경</button>
        <button class="rail-btn" data-a="panel" data-v="layers"><i class="fa-solid fa-layer-group"></i>레이어</button>
        <button class="rail-btn" data-a="panel" data-v="gallery"><i class="fa-solid fa-images"></i>완성본</button>
    </nav>

    <!-- ===== 플라이아웃 ===== -->
    <aside id="flyout" class="w-[340px] flex-none border-r overflow-y-auto p-4" style="border-color:var(--bd)"></aside>

    <!-- ===== 작업 영역 ===== -->
    <main class="flex-1 min-w-0 flex flex-col relative" style="background:#eceef3">
        <div id="toolbar" class="h-12 flex-none bg-white border-b flex items-center gap-1 px-3 overflow-x-auto" style="border-color:var(--bd)"></div>
        <div id="workspace" class="flex-1 overflow-auto relative">
            <div id="stage-wrap" style="min-width:100%;min-height:100%;display:flex;padding:48px 48px 72px;box-sizing:border-box">
                <div id="stage">
                    <canvas id="cv" style="display:block"></canvas>
                    <div id="guides" style="position:absolute;inset:0;pointer-events:none"></div>
                    <div id="sel">
                        <div class="hd" data-h="nw" style="left:0;top:0"></div><div class="hd" data-h="n" style="left:50%;top:0"></div><div class="hd" data-h="ne" style="left:100%;top:0"></div>
                        <div class="hd" data-h="w" style="left:0;top:50%"></div><div class="hd" data-h="e" style="left:100%;top:50%"></div>
                        <div class="hd" data-h="sw" style="left:0;top:100%"></div><div class="hd" data-h="s" style="left:50%;top:100%"></div><div class="hd" data-h="se" style="left:100%;top:100%"></div>
                        <div id="rot" title="드래그해서 회전 (Shift: 15° 단위)"><i class="fa-solid fa-rotate"></i></div>
                    </div>
                    <textarea id="edit" spellcheck="false"></textarea>
                    <div id="empty-hint" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;pointer-events:none;color:#a3a9b8;font-size:14px;text-align:center;line-height:1.6"><i class="fa-regular fa-hand-pointer" style="font-size:26px"></i><div>왼쪽에서 <b>템플릿</b>을 고르거나<br><b>텍스트·사진·요소</b>를 추가해 시작하세요</div></div>
                </div>
            </div>
        </div>
        <div class="absolute right-4 bottom-4 bg-white border rounded-xl shadow-md flex items-center gap-1 px-2 py-1" style="border-color:var(--bd)">
            <button class="ibtn" data-a="zoomOut"><i class="fa-solid fa-minus"></i></button>
            <input type="range" id="zoom-r" min="10" max="300" value="100" class="w-28">
            <button class="ibtn" data-a="zoomIn"><i class="fa-solid fa-plus"></i></button>
            <span id="zoom-v" class="text-xs w-10 text-center font-mono">100%</span>
            <button class="ibtn" data-a="zoomFit" title="화면에 맞추기"><i class="fa-solid fa-expand"></i></button>
        </div>
    </main>
</div>

<div id="lightbox" style="display:none;position:fixed;inset:0;z-index:90;background:rgba(15,18,28,.88);align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px;cursor:zoom-out" onclick="this.style.display='none'"><img id="lb-img" alt="" style="max-width:94vw;max-height:84vh;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff"><div id="lb-cap" style="color:#fff;font-size:13px"></div></div>
<div id="toast"></div>
<input type="file" id="file-img" accept="image/png,image/jpeg" class="hidden">
<input type="file" id="file-json" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* ================= 상수 ================= */
const FONTS = [['Noto Sans KR','노토 산스'],['Black Han Sans','블랙한산스'],['Do Hyeon','도현'],['Jua','주아'],['Gowun Dodum','고운돋움'],['Song Myung','송명'],['Gaegu','개구'],['Nanum Pen Script','나눔손글씨'],['Impact','Impact']];
const FONT_IDS = FONTS.map(f => f[0]);
const SIZES = ['1080x1080', '1080x1350', '1080x1920', '1920x1080'];
const KINDS = ['rect', 'round', 'circle', 'triangle', 'star', 'heart', 'line'];
const KIND_ICON = { rect: 'fa-square', round: 'fa-square', circle: 'fa-circle', triangle: 'fa-play fa-rotate-270', star: 'fa-star', heart: 'fa-heart', line: 'fa-minus' };
const EMOJI = ['😀','😂','🥹','😎','🤔','😭','🔥','✨','💡','🎉','👍','❤️','⭐','✅','❗','❓','💬','📌','🚀','🐶','🐱','🍕','☕','🌈'];
const PALETTE = ['#000000','#ffffff','#ef4444','#f97316','#facc15','#22c55e','#06b6d4','#3b82f6','#6d4aff','#ec4899','#64748b','#fef3c7'];
const GRADS = [['#6d4aff','#ec4899'],['#0ea5e9','#6366f1'],['#f97316','#ef4444'],['#22c55e','#06b6d4'],['#111827','#4b5563'],['#fde68a','#fca5a5'],['#1e1b4b','#4338ca'],['#7f1d1d','#111827']];
const LS = { doc: 'mc2_doc', imgs: 'mc2_imgs', tpl: 'mc2_templates' };

/* ================= 유틸 ================= */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let _id = 0; const nid = () => 'o' + Date.now().toString(36) + (++_id);
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const debounce = (fn, ms) => { let t; const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; d.flush = (...a) => { clearTimeout(t); fn(...a); }; return d; };
const ser = o => JSON.stringify(o, (k, v) => (k[0] === '_' ? undefined : v));
const hexOk = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
const stamp = () => new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);

/* ================= 문서 모델 ================= */
const newText = (o = {}) => ({ id: nid(), type: 'text', x: 540, y: 540, w: 700, h: 0, rot: 0, opacity: 100, locked: false, text: '텍스트를 입력하세요', fontFamily: 'Noto Sans KR', fontSize: 72, color: '#1f2330', bold: true, italic: false, align: 'center', strokeColor: '#000000', strokeW: 0, shadow: false, lineHeight: 125, ...o });
const newShape = (o = {}) => ({ id: nid(), type: 'shape', kind: 'rect', x: 540, y: 540, w: 300, h: 300, rot: 0, opacity: 100, locked: false, fill: '#6d4aff', stroke: '#000000', strokeW: 0, ...o });
const newImage = (o = {}) => ({ id: nid(), type: 'image', imgId: '', x: 540, y: 540, w: 400, h: 400, rot: 0, opacity: 100, locked: false, flipX: false, ...o });
let doc = { name: '제목 없는 디자인', w: 1080, h: 1080, bg: { type: 'color', c1: '#ffffff', c2: '#ffffff', imgId: '' }, objs: [] };
const IMGS = new Map();     // imgId -> { canvas, name, removed:[...] }
let selId = null, zoom = 1, panel = 'templates', clipObj = null, editing = null;
const sel = () => doc.objs.find(o => o.id === selId) || null;

/* ---- 검증 (JSON 가져오기·저장소 복원 공용) ---- */
function sanitizeObj(o) {
    if (!o || typeof o !== 'object') return null;
    const num = (v, a, b, d) => (typeof v === 'number' && isFinite(v) ? clamp(v, a, b) : d);
    const col = (v, d) => (hexOk(v) ? v.toLowerCase() : d);
    const base = { id: nid(), x: num(o.x, -2000, 6000, 540), y: num(o.y, -2000, 6000, 540), w: num(o.w, 10, 6000, 300), h: num(o.h, 2, 6000, 300), rot: num(o.rot, -360, 360, 0), opacity: num(o.opacity, 0, 100, 100), locked: o.locked === true };
    if (o.type === 'text') {
        const t = newText({ ...base });
        t.text = typeof o.text === 'string' ? o.text.slice(0, 600) : ''; t.fontFamily = FONT_IDS.includes(o.fontFamily) ? o.fontFamily : t.fontFamily;
        t.fontSize = num(o.fontSize, 8, 600, 72); t.color = col(o.color, t.color); t.strokeColor = col(o.strokeColor, '#000000'); t.strokeW = num(o.strokeW, 0, 40, 0);
        t.bold = o.bold !== false; t.italic = o.italic === true; t.shadow = o.shadow === true; t.align = ['left', 'center', 'right'].includes(o.align) ? o.align : 'center'; t.lineHeight = num(o.lineHeight, 80, 250, 125);
        return t;
    }
    if (o.type === 'shape') return newShape({ ...base, kind: KINDS.includes(o.kind) ? o.kind : 'rect', fill: col(o.fill, '#6d4aff'), stroke: col(o.stroke, '#000000'), strokeW: num(o.strokeW, 0, 60, 0) });
    return null;   // 사진은 파일 데이터가 없으므로 템플릿·JSON에는 포함하지 않음
}
function validateDocRaw(d) {
    const errors = [];
    if (!d || typeof d !== 'object' || Array.isArray(d)) return { ok: false, errors: ['문서가 객체 형태가 아닙니다'] };
    if (!SIZES.includes(`${d.w}x${d.h}`)) errors.push('w/h: 지원하지 않는 페이지 크기');
    if (!Array.isArray(d.objs)) errors.push('objs: 배열이어야 함'); else if (d.objs.length > 200) errors.push('objs: 200개 초과');
    if (d.bg !== undefined && (typeof d.bg !== 'object' || d.bg === null)) errors.push('bg: 객체여야 함');
    if (d.bg && d.bg.type !== undefined && !['color', 'gradient', 'image'].includes(d.bg.type)) errors.push('bg.type: 허용되지 않은 값');
    if (d.bg && ['c1', 'c2'].some(k => d.bg[k] !== undefined && !hexOk(d.bg[k]))) errors.push('bg 색상: #RRGGBB 형식이어야 함');
    if (Array.isArray(d.objs)) d.objs.forEach((o, i) => { if (!o || !['text', 'shape', 'image'].includes(o.type)) errors.push(`objs[${i}]: 알 수 없는 종류`); else if (o.type === 'text' && typeof o.text !== 'string') errors.push(`objs[${i}]: text는 문자열이어야 함`); });
    if (errors.length) return { ok: false, errors };
    const bgT = d.bg && d.bg.type === 'image' ? 'color' : (d.bg && d.bg.type) || 'color';
    return { ok: true, errors, doc: { name: typeof d.name === 'string' ? d.name.slice(0, 40) : '가져온 디자인', w: d.w, h: d.h, bg: { type: bgT, c1: hexOk(d.bg && d.bg.c1) ? d.bg.c1.toLowerCase() : '#ffffff', c2: hexOk(d.bg && d.bg.c2) ? d.bg.c2.toLowerCase() : '#ffffff', imgId: '' }, objs: d.objs.map(sanitizeObj).filter(Boolean) } };
}

/* ================= 렌더러 ================= */
function wrapParagraph(g, p, maxW) {
    const lines = []; let cur = '';
    for (const word of p.split(' ')) {

        if (!v || typeof v.url !== 'string' || !/^data:image\/(webp|png|jpeg);base64,/.test(v.url)) continue;
        try { const im = new Image(); im.src = v.url; await im.decode(); const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; c.getContext('2d').drawImage(im, 0, 0);
            const t = document.createElement('canvas'), k = 120 / Math.max(c.width, c.height); t.width = Math.round(c.width * k); t.height = Math.round(c.height * k); t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
            IMGS.set(id, { canvas: c, name: String(v.name || '사진').slice(0, 60), removed: [], thumb: t.toDataURL('image/jpeg', .7), url: v.url }); } catch { }
    }
}
(async function init() {
    loadUserTpl(); loadGallery();
    const saved = lsGet(LS.doc, null);
    if (saved) {
        const v = validateDoc({ ...saved, objs: (saved.objs || []).filter(o => o && o.type !== 'image') });
        if (v.ok) {
            await restoreImages();
            doc = v.doc; doc.name = typeof saved.name === 'string' ? saved.name.slice(0, 40) : doc.name;
            // 저장된 사진 객체/배경 복원 (이미지 데이터가 있는 것만)
            for (const o of saved.objs) if (o && o.type === 'image' && IMGS.has(o.imgId)) { const im = newImage({ imgId: o.imgId, x: +o.x || 540, y: +o.y || 540, w: clamp(+o.w || 400, 10, 6000), h: clamp(+o.h || 400, 10, 6000), rot: +o.rot || 0, opacity: clamp(+o.opacity || 100, 0, 100), flipX: o.flipX === true, locked: o.locked === true }); doc.objs.push(im); }
            if (saved.bg && saved.bg.type === 'image' && IMGS.has(saved.bg.imgId)) doc.bg = { type: 'image', c1: doc.bg.c1, c2: doc.bg.c2, imgId: saved.bg.imgId };
        }
    }
    syncDocUI(); buildToolbar(); renderPanel(); fit(); pushHistory(); updUndo();
    await Promise.all(FONT_IDS.map(f => document.fonts.load(`bold 48px "${f}"`).catch(() => { })));
    thumbCache.clear(); render(); renderPanel(); await buildGallery();
})();
</script>
